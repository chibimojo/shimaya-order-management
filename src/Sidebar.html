<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <style>
      body { font-family: Arial, sans-serif; font-size: 13px; padding: 8px; }
      label { display: block; margin-top: 10px; font-weight: bold; }
      input, textarea { width: 100%; box-sizing: border-box; padding: 4px; margin-top: 2px; }
      button { margin-top: 14px; width: 100%; padding: 8px; }
      #status { margin-top: 10px; }
    </style>
  </head>
  <body>
    <form id="order-form">
      <label for="customerName">Customer Name</label>
      <input type="text" id="customerName" required>

      <label for="contact">Contact</label>
      <input type="text" id="contact">

      <label for="item">Item</label>
      <input type="text" id="item" required>

      <label for="quantity">Quantity</label>
      <input type="number" id="quantity" min="1" value="1" required>

      <label for="unitPrice">Unit Price</label>
      <input type="number" id="unitPrice" min="0" step="0.01" value="0" required>

      <label for="notes">Notes</label>
      <textarea id="notes" rows="3"></textarea>

      <button type="submit">Add Order</button>
    </form>
    <div id="status"></div>

    <script>
      document.getElementById('order-form').addEventListener('submit', function(e) {
        e.preventDefault();
        var statusEl = document.getElementById('status');
        statusEl.textContent = 'Saving...';

        var orderData = {
          customerName: document.getElementById('customerName').value,
          contact: document.getElementById('contact').value,
          item: document.getElementById('item').value,
          quantity: document.getElementById('quantity').value,
          unitPrice: document.getElementById('unitPrice').value,
          notes: document.getElementById('notes').value
        };

        google.script.run
          .withSuccessHandler(function(orderId) {
            statusEl.textContent = 'Order added: ' + orderId;
            document.getElementById('order-form').reset();
          })
          .withFailureHandler(function(err) {
            statusEl.textContent = 'Error: ' + err.message;
          })
          .addOrder(orderData);
      });
    </script>
  </body>
</html>
